spring.application.name=rest-hello
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
#default spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.web.error.include-stacktrace=never

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.flem.resthello.controller

# Show only specific path patterns (Ant-style)
springdoc.paths-to-match=/filtered/**,/user/**

# Hide specific paths
# springdoc.paths-to-exclude=/versioning/**,/actuator/**